<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>🦄💊🔥 THE ULTIMATE TRIP 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Bangers&family=Courier+Prime&display=swap"
        rel="stylesheet">
    <style>
        /* MASHUP OF STYLES */
        :root {
            --neon-pink: #ff00ff;
            --neon-green: #39ff14;
            --clinical-white: #f0f0f0;
            --void-black: #000;
        }

        body {
            background: #000;
            overflow: hidden;
            margin: 0;
            font-family: 'Courier Prime', monospace;
        }

        /* 1. LAYER: NEON GRID (Concept 1) */
        .grid {
            position: fixed;
            width: 200vw;
            height: 200vh;
            background: linear-gradient(transparent 95%, var(--neon-pink) 50%),
                linear-gradient(90deg, transparent 95%, var(--neon-green) 50%);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 5s linear infinite;
            z-index: -3;
        }

        @keyframes gridMove {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 50px;
            }
        }

        /* 2. LAYER: MEDICAL OVERLAY (Concept 7) */
        .medical-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            border: 2px solid #fff;
            padding: 10px;
            color: #fff;
            z-index: 10;
        }

        /* 3. LAYER: SHITPOST CHAOS (Concept 4) */
        .chaos-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 5;
        }

        h1 {
            font-family: 'Bangers';
            font-size: 8vw;
            color: #fff;
            text-shadow:
                5px 5px 0 var(--neon-pink),
                -5px -5px 0 var(--neon-green);
            white-space: nowrap;
            animation: rainbow 2s linear infinite;
        }

        @keyframes rainbow {
            0% {
                filter: hue-rotate(0deg);
            }

            100% {
                filter: hue-rotate(360deg);
            }
        }

        .cta-btn {
            background: black;
            color: white;
            font-family: 'Orbitron';
            font-size: 2rem;
            padding: 20px 40px;
            border: 5px solid var(--neon-green);
            cursor: pointer;
            box-shadow: 0 0 30px var(--neon-green);
        }

        .cta-btn:hover {
            background: white;
            color: black;
            transform: scale(1.1) rotate(5deg);
        }

        /* POPUPS */
        .popup {
            position: fixed;
            background: #dedede;
            border: 2px solid blue;
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.5);
            padding: 5px;
            font-family: sans-serif;
            width: 200px;
            z-index: 100;
        }

        .popup-header {
            background: blue;
            color: white;
            padding: 2px;
            font-weight: bold;
            cursor: move;
        }

        .popup-body {
            padding: 10px;
            text-align: center;
            font-size: 0.8rem;
        }

        /* FLOATING 3D */
        .horse-3d {
            position: fixed;
            font-size: 5rem;
            animation: bounce 3s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-50px);
            }
        }
    </style>
</head>

<body>

    <!-- NEON BACK -->
    <div class="grid"></div>

    <!-- MEDICAL UI -->
    <div class="medical-overlay">
        STATUS: HALLUCINATING<br>
        BPM: 420<br>
        DOPAMINE: CRITICAL
    </div>

    <!-- MAIN CONTENT -->
    <div class="chaos-container">
        <h1>💊 FIRE HORSE.EXE 🐴</h1>
        <p
            style="color: white; background: red; display: inline-block; font-size: 2rem; font-family: 'Bangers'; padding: 5px;">
            FATAL ERROR: TOO MUCH SWAG
        </p>
        <br><br>
        <button class="cta-btn" onclick="startTrip()">ENTER THE VOID</button>
    </div>

    <!-- POPUPS WILL SPAWN HERE -->

    <script>
        // SPAWN POPUPS
        const msgs = [
            "⚠️ SYSTEM FAILURE",
            "🐴 HORSE DETECTED",
            "💊 TAKE YOUR MEDS",
            "🔥 FIRE HAZARD",
            "🧧 FREE MONEY?",
            "💀 BRUH",
            "💯 NO CAP"
        ];

        function spawnPopup() {
            const div = document.createElement('div');
            div.className = 'popup';
            div.style.left = Math.random() * (window.innerWidth - 220) + 'px';
            div.style.top = Math.random() * (window.innerHeight - 150) + 'px';

            const txt = msgs[Math.floor(Math.random() * msgs.length)];

            div.innerHTML = `
                <div class="popup-header">ERROR_404</div>
                <div class="popup-body">
                    ${txt}<br><br>
                    <button onclick="this.parentElement.parentElement.remove()">OK</button>
                </div>
            `;

            document.body.appendChild(div);
        }

        setInterval(spawnPopup, 2000);

        function startTrip() {
            // CONFETTI STORM
            var duration = 5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            var interval = setInterval(function () {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);

                confetti({
                    ...defaults, particleCount,
                    origin: { x: Math.random(), y: Math.random() - 0.2 }
                });
            }, 250);

            // GLITCH SCREEN
            document.body.style.filter = "invert(1)";
            setTimeout(() => document.body.style.filter = "invert(0)", 100);
            setTimeout(() => document.body.style.filter = "invert(1)", 200);
            setTimeout(() => document.body.style.filter = "invert(0)", 300);

            // AUDIO HINT
            const audio = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'); // Placeholder
            // audio.play().catch(e => console.log("Audio requires interaction"));
        }
    </script>
</body>

</html>
